<script>
const orb=document.getElementById('orbc'),rim=document.getElementById('rimc'),cur=document.getElementById('curc'),svg=document.querySelector('svg');
const R=330,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const set=r=>{orb.setAttribute('r',r);rim.setAttribute('r',r)};
if(still)set(R);else{const t0=performance.now()+1900;(function f(t){const k=Math.min(Math.max((t-t0)/1400,0),1),e=1-Math.pow(1-k,4);set(R*e);if(k<1)requestAnimationFrame(f)})(0)}
addEventListener('pointermove',ev=>{const b=svg.getBoundingClientRect(),s=1024/b.width;cur.setAttribute('cx',(ev.clientX-b.left)*s);cur.setAttribute('cy',(ev.clientY-b.top)*s)});
</script></body></html>
